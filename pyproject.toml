[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "computegrid"
version = "0.1.0"
description = "Fault-tolerant distributed job processing service"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "alembic>=1.14,<2.0",
    "celery>=5.5,<6.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.7,<1.0",
]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["computegrid_api*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "integration: requires the local PostgreSQL test database",
    "e2e: requires the local PostgreSQL test database and RabbitMQ",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api", "migrations", "tests"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

