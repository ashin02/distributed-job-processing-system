apiVersion: v1
kind: Service
metadata:
  name: computegrid-api
  namespace: computegrid
  labels:
    app.kubernetes.io/name: computegrid-api
    app.kubernetes.io/part-of: computegrid
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: computegrid-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: computegrid-api
  namespace: computegrid
  labels:
    app.kubernetes.io/name: computegrid-api
    app.kubernetes.io/part-of: computegrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: computegrid-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: computegrid-api
        app.kubernetes.io/part-of: computegrid
    spec:
      containers:
        - name: api
          image: computegrid:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: POSTGRES_PASSWORD
            - name: COMPUTEGRID_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: COMPUTEGRID_DEVELOPMENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: COMPUTEGRID_DEVELOPMENT_API_TOKEN
            - name: COMPUTEGRID_DEVELOPMENT_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_DEVELOPMENT_CLIENT_ID
            - name: COMPUTEGRID_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_CORS_ORIGINS
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: computegrid-relay
  namespace: computegrid
  labels:
    app.kubernetes.io/name: computegrid-relay
    app.kubernetes.io/part-of: computegrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: computegrid-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: computegrid-relay
        app.kubernetes.io/part-of: computegrid
    spec:
      containers:
        - name: relay
          image: computegrid:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - computegrid_api.outbox_relay
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: POSTGRES_PASSWORD
            - name: COMPUTEGRID_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: RABBITMQ_PASSWORD
            - name: COMPUTEGRID_BROKER_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672//
            - name: COMPUTEGRID_JOB_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_JOB_QUEUE
            - name: COMPUTEGRID_OUTBOX_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_OUTBOX_BATCH_SIZE
            - name: COMPUTEGRID_OUTBOX_POLL_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_OUTBOX_POLL_INTERVAL_SECONDS
            - name: COMPUTEGRID_JOB_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_JOB_MAX_ATTEMPTS
            - name: COMPUTEGRID_RETRY_BASE_DELAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_RETRY_BASE_DELAY_SECONDS
            - name: COMPUTEGRID_RETRY_MAX_DELAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_RETRY_MAX_DELAY_SECONDS
            - name: COMPUTEGRID_RETRY_JITTER_RATIO
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_RETRY_JITTER_RATIO
            - name: COMPUTEGRID_JOB_LEASE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_JOB_LEASE_SECONDS
            - name: COMPUTEGRID_LEASE_RECOVERY_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_LEASE_RECOVERY_BATCH_SIZE
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: computegrid-worker
  namespace: computegrid
  labels:
    app.kubernetes.io/name: computegrid-worker
    app.kubernetes.io/part-of: computegrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: computegrid-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: computegrid-worker
        app.kubernetes.io/part-of: computegrid
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: computegrid:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec python -m celery
              -A computegrid_api.celery_app:celery_app worker
              --loglevel=INFO
              --concurrency="${COMPUTEGRID_WORKER_CONCURRENCY}"
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: POSTGRES_PASSWORD
            - name: COMPUTEGRID_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: computegrid-secrets
                  key: RABBITMQ_PASSWORD
            - name: COMPUTEGRID_BROKER_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672//
            - name: COMPUTEGRID_JOB_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_JOB_QUEUE
            - name: COMPUTEGRID_JOB_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_JOB_MAX_ATTEMPTS
            - name: COMPUTEGRID_RETRY_BASE_DELAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_RETRY_BASE_DELAY_SECONDS
            - name: COMPUTEGRID_RETRY_MAX_DELAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_RETRY_MAX_DELAY_SECONDS
            - name: COMPUTEGRID_RETRY_JITTER_RATIO
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_RETRY_JITTER_RATIO
            - name: COMPUTEGRID_JOB_LEASE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_JOB_LEASE_SECONDS
            - name: COMPUTEGRID_WORKER_SOFT_SHUTDOWN_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_WORKER_SOFT_SHUTDOWN_TIMEOUT_SECONDS
            - name: COMPUTEGRID_WORKER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: computegrid-config
                  key: COMPUTEGRID_WORKER_CONCURRENCY
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  python -m celery
                  -A computegrid_api.celery_app:celery_app inspect ping
                  --destination "celery@${HOSTNAME}" --timeout=3 | grep -q pong
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
